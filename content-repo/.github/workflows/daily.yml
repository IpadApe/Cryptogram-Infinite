name: daily

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate daily files (today .. today+2, backfilling gaps)
        run: python scripts/publish_daily.py

      - name: Validate
        run: python scripts/validate.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain daily/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add daily/
            git commit -m "daily: publish $(date -u +%F)"
            git push
          else
            echo "no changes"
          fi
