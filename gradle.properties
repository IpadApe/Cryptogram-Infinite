# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# AGP 9.1 uses built-in Kotlin by default (no org.jetbrains.kotlin.android plugin needed).
# KSP 2.3.10+ is required for it; see gradle/libs.versions.toml.
# Non-transitive R classes (default in AGP 9, set explicitly for clarity).
android.nonTransitiveRClass=true
android.useAndroidX=true

# ---------------------------------------------------------------------------
